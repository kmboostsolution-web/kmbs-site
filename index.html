  <style>
    :root {
      --bg: #06080f;
      --card-bg: #0d121f;
      --card-border: #1b2438;
      --card-hover: #141c30;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.12);
      --whatsapp: #25D366;
      --whatsapp-hover: #20ba59;
      --instagram: #E1306C;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: var(--font);
      line-height: 1.6;
      overflow-x: hidden;
      width: 100%;
      background-image: radial-gradient(circle at 50% -5%, var(--accent-glow) 0%, transparent 45%);
      background-repeat: no-repeat;
    }

    .container { width: 90%; max-width: 1140px; margin: 0 auto; }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(6, 8, 15, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.9rem 0;
    }

    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 16px; }

    .brand-logo { display: flex; align-items: center; text-decoration: none; }
    .brand-logo-img { height: 48px; width: auto; max-width: 260px; object-fit: contain; display: block; }

    nav.nav-desktop ul { display: flex; list-style: none; gap: 1.8rem; align-items: center; }
    nav.nav-desktop a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
    nav.nav-desktop a:hover { color: var(--text-white); }

    .btn-menu-burger {
      display: none; background: none; border: none; color: #fff; cursor: pointer; padding: 4px;
    }
    .btn-menu-burger svg { width: 28px; height: 28px; fill: #fff; }

    /* DRAWER LATERAL (MOBILE) */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px);
      z-index: 998; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .drawer-overlay.active { opacity: 1; pointer-events: auto; }

    .mobile-drawer {
      position: fixed; top: 0; left: -280px; width: 260px; height: 100vh;
      background: #090d17; border-right: 1px solid var(--card-border); z-index: 999;
      display: flex; flex-direction: column; padding: 1.8rem 1.4rem;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.9);
    }
    .mobile-drawer.active { left: 0; }
    .drawer-top {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 1.2rem; border-bottom: 1px solid var(--card-border); margin-bottom: 1.8rem;
    }
    .drawer-close { background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; }
    .drawer-links { list-style: none; display: flex; flex-direction: column; gap: 1.2rem; }
    .drawer-links a { color: var(--text-white); text-decoration: none; font-size: 1.02rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .drawer-links a span { color: var(--accent); }

    /* BOTÕES */
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 0.85rem 1.8rem;
      border-radius: 8px; font-weight: 700; font-size: 0.95rem; text-decoration: none;
      transition: all 0.2s ease; cursor: pointer; border: none;
    }
    .btn-wa { background: var(--whatsapp); color: #fff; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
    .btn-wa:hover { background: var(--whatsapp-hover); transform: translateY(-2px); }
    .btn-ghost { background: rgba(255, 255, 255, 0.04); color: #fff; border: 1px solid var(--card-border); }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--accent); }

    /* HERO */
    .hero { padding: 6.5rem 0 5rem; text-align: center; }
    .hero-badge {
      display: inline-block; padding: 6px 16px; background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 50px;
      font-size: 0.85rem; font-weight: 700; color: var(--accent); margin-bottom: 1.8rem;
    }
    .hero h1 { font-size: 3.1rem; font-weight: 800; line-height: 1.15; margin-bottom: 1.4rem; letter-spacing: -0.03em; }
    .hero p { font-size: 1.15rem; color: var(--text-muted); max-width: 680px; margin: 0 auto 2.5rem; }
    .hero-ctas { display: flex; justify-content: center; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 3.5rem; }

    /* VITRINE VISUAL */
    .hero-mockup-wrapper { position: relative; max-width: 900px; margin: 0 auto; }
    .hero-mockup-window {
      background: #0d121f; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 16px;

    }

    .mockup-dot { width: 10px; height: 10px; border-radius: 50%; }

    .mockup-address {
      background: #05070c; border: 1px solid #1b2438; border-radius: 6px; padding: 5px 14px;

    }
    .mockup-address span { color: var(--whatsapp); }

    .hero-mockup-body {
      padding: 2.8rem 2.2rem; display: grid; grid-template-columns: 1.2fr 0.8fr;

    .mockup-badges-wrap { display: flex; flex-direction: column; gap: 1rem; }

    .mockup-stat-card small { color: var(--text-muted); font-size: 0.82rem; }

    /* SEÇÕES */
    section { padding: 5.5rem 0; border-top: 1px solid var(--card-border); }
    .section-head { text-align: center; max-width: 700px; margin: 0 auto 3.5rem; }

    .section-head h2 { font-size: 2.1rem; font-weight: 800; margin-top: 0.5rem; letter-spacing: -0.02em; }
    .section-head p { color: var(--text-muted); margin-top: 0.8rem; }

    /* GRIDS DE SERVIÇOS REESTRUTURADA PARA SEO (H2/H3) */
    .services-silo-grid {
      display: grid;

      gap: 2rem;
    }

    .service-silo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 2.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .service-silo-card:hover {
      border-color: var(--accent);

      background: var(--card-hover);
    }

    .service-silo-card h2 {
      font-size: 1.5rem;

      margin-bottom: 0.8rem;

      gap: 10px;
    }

    .service-silo-card p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .sub-pillars {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      padding-left: 0.5rem;
      border-left: 2px solid rgba(59, 130, 246, 0.3);
    }

    .sub-pillars h3 {
      font-size: 0.92rem;
      font-weight: 600;
      color: #e2e8f0;
      margin: 0;
    }

    .service-link-arrow {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.2s ease;
    }

    .service-link-arrow:hover {
      gap: 10px;
      color: #93c5fd;
    }

    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; margin-top: 2.5rem; }
    .chip { background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 18px; border-radius: 8px; font-size: 0.92rem; font-weight: 600; }
    .chip span { color: var(--whatsapp); margin-right: 6px; }
